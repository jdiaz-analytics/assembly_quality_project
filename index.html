<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de producción — Armado de válvulas | Control de Calidad</title>
<meta name="description" content="Sistema de registro y control de calidad para el armado de válvulas: carga de lotes de producción, seguimiento de FTY (First Time Yield), estaciones de armado y causas de NOK/retrabajo.">

<meta property="og:type" content="website">
<meta property="og:title" content="Registro de producción — Armado de válvulas">
<meta property="og:description" content="Sistema de registro y control de calidad para el armado de válvulas: carga de lotes de producción, seguimiento de FTY (First Time Yield), estaciones de armado y causas de NOK/retrabajo.">
<meta property="og:image" content="img/og-image.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-title">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 L9 7 L9 17 Z"/><path d="M22 12 L15 7 L15 17 Z"/><line x1="12" y1="12" x2="12" y2="4"/><line x1="8" y1="4" x2="16" y2="4"/></svg>
      <span>Registro de producción por lote</span>
    </div>
    <div class="eyebrow">CONTROL DE CALIDAD — ARMADO DE VÁLVULAS</div>
    <div class="login-fields">
      <div class="field"><label>Usuario</label><input id="loginLegajo" placeholder="ARJDI" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="current-password"></div>
    </div>
    <div class="login-error hidden" id="loginError"></div>
    <button class="btn-primary" id="loginBtn">Ingresar</button>
  </div>
</div>

<div id="appRoot" class="hidden">
<header class="header">
  <div>
    <div class="eyebrow">CONTROL DE CALIDAD — ARMADO DE VÁLVULAS</div>
    <div class="title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12 L9 7 L9 17 Z"/><path d="M22 12 L15 7 L15 17 Z"/><line x1="12" y1="12" x2="12" y2="4"/><line x1="8" y1="4" x2="16" y2="4"/></svg>
      <span>Registro de producción por lote</span>
    </div>
  </div>
  <div class="header-right">
    <nav class="tabs">
      <button class="tabbtn active" id="tabRegistroBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
        Registro
      </button>
      <button class="tabbtn" id="tabPanelBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 1 18 0"/><line x1="12" y1="12" x2="16" y2="7"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
        Panel FTY
      </button>
    </nav>
    <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
  </div>
</header>

<main class="content">
  <div id="saveError" class="error-banner hidden"></div>

  <section id="registroView">
    <div class="card" id="formCard">
      <div class="notch-label">NUEVA ORDEN</div>
      <div class="form-grid">
        <div class="field"><label>Código de producto <span class="req">*</span></label><input id="fProducto" placeholder="VLV-PN40-DN50"></div>
        <div class="field"><label>N° orden de trabajo <span class="req">*</span></label><input id="fOrden" placeholder="OT-2026-0341"></div>
        <div class="field">
          <label>Cantidad ordenada <span class="req">*</span></label>
          <input id="fCantidad" type="number" inputmode="numeric" min="0" placeholder="0">
          <div class="field-hint" id="fCantidadCheck"></div>
        </div>
        <div class="field"><label>Cantidad OK <span class="req">*</span></label><input id="fOk" type="number" inputmode="numeric" min="0" placeholder="0"></div>
        <div class="field"><label>Cantidad NOK <span class="req">*</span></label><input id="fNok" type="number" inputmode="numeric" min="0" placeholder="0"></div>
        <div class="field"><label>Cantidad retrabajo <span class="req">*</span></label><input id="fRw" type="number" inputmode="numeric" min="0" placeholder="0"></div>

        <hr class="field-full form-divider">

        <div class="field"><label>Operario</label><div class="session-user" id="sessionUserDisplay">—</div></div>
        <div class="field">
          <label>Fecha de producción <span class="req">*</span></label>
          <input id="fFecha" type="date">
        </div>

        <div class="field"><label>Estación de armado</label><select id="fEstacion"><option value="">Seleccioná una estación</option></select></div>
        <div class="field"><label>Causa NOK-Retrabajo</label><select id="fCausa"><option value="">Seleccioná una causa</option></select></div>
        <div class="field field-full hidden" id="fComentarioCausaWrap">
          <label>Comentario (causa "Otros")</label>
          <input id="fComentarioCausa" placeholder="Detalle la causa">
        </div>
      </div>
      <div class="form-error hidden" id="formError"></div>
      <div class="form-actions"><button class="btn-primary" id="saveRecordBtn" disabled>+ Guardar registro</button></div>
    </div>
  </section>

  <section id="panelView" class="hidden">
    <div class="card filters">
      <div class="filters-title">FILTROS</div>
      <div class="field"><label>Desde</label><input type="date" id="filterDesde"></div>
      <div class="field"><label>Hasta</label><input type="date" id="filterHasta"></div>
      <div class="field"><label>Producto</label><select id="filterProducto"><option value="todos">Todos</option></select></div>
      <div class="field"><label>Operario</label><select id="filterOperario"><option value="todos">Todos</option></select></div>
      <div class="field"><label>Estación de armado</label><select id="filterEstacion"><option value="todos">Todas</option></select></div>
      <div class="field">
        <label class="label-with-icon"><svg class="icon-warning" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 L22 20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg> Causa NOK-Retrabajo</label>
        <select id="filterCausa"><option value="todos">Todas</option></select>
      </div>
      <button class="btn-ghost-text hidden" id="clearFiltersBtn">Limpiar filtros</button>
    </div>

    <div class="card gauge-card">
      <div id="gaugeWrap"></div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="card">
      <div class="notch-label">FTY POR ESTACIÓN DE ARMADO</div>
      <div class="chart-wrap" id="byEstacionWrap"></div>
    </div>

    <div class="card">
      <div class="notch-label">CAUSAS NOK-RETRABAJO (PARETO)</div>
      <div class="chart-wrap" id="paretoWrap" style="height:260px;">
        <div id="paretoChart" style="width:100%;height:100%;"></div>
      </div>
    </div>

    <div class="card">
      <div class="row-between">
        <div class="notch-label">TENDENCIA DE FTY</div>
        <div class="toggle-group" id="groupByToggle">
          <button class="toggle active" data-g="dia">Día</button>
          <button class="toggle" data-g="mes">Mes</button>
          <button class="toggle" data-g="anio">Año</button>
        </div>
      </div>
      <div class="chart-wrap" id="trendWrap" style="height:260px;">
        <div id="trendChart" style="width:100%;height:100%;"></div>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-header">
        <div class="notch-label" id="historialLabel">HISTORIAL DE LOTES</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-secondary" id="exportXlsBtn">⬇ Exportar a Excel</button>
          <button class="btn-secondary" id="exportPdfBtn">⬇ Exportar panel (PDF)</button>
        </div>
      </div>
      <div id="tableWrap"></div>
    </div>
  </section>
</main>
</div>

<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="notch-label">CONFIRMAR REGISTRO</div>
    <div class="modal-summary" id="modalSummary"></div>
    <div class="modal-actions">
      <button class="btn-ghost-text" id="modalCancelBtn">Revisar</button>
      <button class="btn-primary" id="modalConfirmBtn">Confirmar y guardar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/script.js"></script>
</body>
</html>
